name: Bootstrap CertificateMaker v1.2.3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  import-v123:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bootstrap/v1.2.3'
    runs-on: windows-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore verified repository package
        shell: powershell
        run: |
          if (-not (Test-Path "_bootstrap")) {
            Write-Host "Bootstrap payload already consumed; nothing to do."
            exit 0
          }

          $parts = @(Get-ChildItem "_bootstrap/part_*.txt" | Sort-Object Name)
          if ($parts.Count -ne 7) { throw "Expected 7 bootstrap payload chunks, found $($parts.Count)" }

          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw -Encoding UTF8 }) -join ''
          $zipPath = Join-Path $env:RUNNER_TEMP "cert_maker_repo_ready_v1.2.3.zip"
          [IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String($b64))

          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "bb50f9388cc2c06e2df33c8d8d9ef07cadaa32ac26f27c46bee2ebf7a0a0bb45") {
            throw "Repository package SHA256 mismatch: $hash"
          }

          $extract = Join-Path $env:RUNNER_TEMP "cert_maker_v123_extract"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $zipPath -DestinationPath $extract -Force

          Get-ChildItem -Force $extract | Copy-Item -Destination . -Recurse -Force

          # GitHub Actions GITHUB_TOKEN cannot create/update workflow files.
          # The verified build workflow is added to main separately after this PR is merged.
          if (Test-Path ".github/workflows/build-windows.yml") {
            Remove-Item ".github/workflows/build-windows.yml" -Force
          }
          Remove-Item "_bootstrap" -Recurse -Force

      - name: Validate imported files
        shell: powershell
        run: |
          if (-not (Test-Path "certificate_maker.py")) { throw "certificate_maker.py missing" }
          if (-not (Test-Path "samples/template.pptx")) { throw "samples/template.pptx missing" }
          if (-not (Test-Path "samples/data.xlsx")) { throw "samples/data.xlsx missing" }

          python -m py_compile certificate_maker.py

          $sourceHash = (git hash-object certificate_maker.py).Trim()
          $pptxHash = (git hash-object samples/template.pptx).Trim()
          $xlsxHash = (git hash-object samples/data.xlsx).Trim()

          if ($sourceHash -ne "80becb427bdc55034cce89dfc68dd0d61a9cf560") { throw "Source blob hash mismatch: $sourceHash" }
          if ($pptxHash -ne "99e4a79ede2bb5dad42b7c3dab1d7d879c6deae9") { throw "PPTX blob hash mismatch: $pptxHash" }
          if ($xlsxHash -ne "85c3ccaa37a165a4c6ed3f1e5fb627dae39f9ab6") { throw "XLSX blob hash mismatch: $xlsxHash" }

          if (Select-String -Path certificate_maker.py -Pattern 'presentation\.SaveAs\(' -Quiet) { throw "Legacy Presentation.SaveAs remains" }
          if (-not (Select-String -Path certificate_maker.py -Pattern 'ExportAsFixedFormat' -Quiet)) { throw "PDF ExportAsFixedFormat missing" }
          if (-not (Select-String -Path certificate_maker.py -Pattern 'SaveCopyAs' -Quiet)) { throw "PPTX SaveCopyAs missing" }
          if (-not (Select-String -Path certificate_maker.py -Pattern 'APP_VERSION = "1.2.3"' -Quiet)) { throw "v1.2.3 marker missing" }

      - name: Commit exact v1.2.3 package
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Import CertificateMaker v1.2.3"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          } else {
            Write-Host "No changes to commit."
          }
